<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suvéea</title>

<meta name="description" content="Suvéea — From Nature. Distilled with Tradition. Crafted by Suvéea. Our fragrance house is coming soon.">
<meta name="theme-color" content="#0a0705">
<meta name="color-scheme" content="dark">

<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="manifest" href="site.webmanifest">

<!-- Social preview. Replace the absolute URL below once the live domain is known. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Suvéea">
<meta property="og:site_name" content="Suvéea">
<meta property="og:description" content="From Nature. Distilled with Tradition. Crafted by Suvéea. Coming soon.">
<meta property="og:image" content="assets/img/hero.jpg">
<meta property="og:image:width" content="1678">
<meta property="og:image:height" content="937">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Suvéea">
<meta name="twitter:description" content="From Nature. Distilled with Tradition. Crafted by Suvéea. Coming soon.">
<meta name="twitter:image" content="assets/img/hero.jpg">

<link rel="preload" as="image" href="assets/img/hero.webp" fetchpriority="high">
<link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
  <!-- The artwork carries the wordmark; this keeps it available to search and screen readers. -->
  <header class="sr-only">
    <h1>Suvéea</h1>
    <p>From Nature. Distilled with Tradition. Crafted by Suvéea.</p>
    <p>Coming soon.</p>
  </header>

  <main class="stage">
    <canvas id="scene" role="img"
            aria-label="Four Suvéea attar bottles under warm spotlights, with the Suvéea wordmark and the words Coming Soon."></canvas>

    <!-- Shown when WebGL is unavailable, and while the scene warms up. -->
    <div class="fallback" aria-hidden="true">
      <div class="fallback__wash"></div>
      <picture>
        <source srcset="assets/img/hero.webp" type="image/webp">
        <img src="assets/img/hero.jpg" alt="" width="1678" height="937" decoding="async">
      </picture>
    </div>

    <div class="loader" id="loader" aria-hidden="true">
      <img src="assets/img/monogram.webp" alt="" width="210" height="368" decoding="async" fetchpriority="high">
    </div>
  </main>

  <noscript>
    <style>.fallback{opacity:1!important}.loader{display:none}</style>
  </noscript>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
